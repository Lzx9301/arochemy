<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>結帳｜Arochemy</title>
  <link rel="icon" type="image/png" href="./images/logo.png" />
  <link rel="apple-touch-icon" href="./images/logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- Sticky Header -->
  <header class="header" id="top">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="回到首頁">
        <img src="./images/head-logo.png" alt="Arochemy Essential Oil" class="brand-logo" />
      </a>
      <nav class="nav">
        <a href="brand.html">品牌故事</a>
        <a href="products.html">產品</a>
        <a href="service.html">服務</a>
        <a href="articles.html">文章</a>
        <a href="contact.html">聯絡</a>
        <a href="faq.html">FAQ</a>
      </nav>
      <a id="userArea" class="nav-user" href="login.html" aria-label="會員登入">
        <svg class="user-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c1.6-4.5 4.6-7 8-7s6.4 2.5 8 7"></path>
        </svg>
        <span id="userEmail"></span>
      </a>
      <a href="cart.html" class="nav-cart" aria-label="購物車">
        <svg class="cart-icon" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6h15l-1.5 9h-12z"></path>
          <path d="M6 6 5.2 3H3"></path>
          <circle cx="9" cy="20" r="1.5"></circle>
          <circle cx="18" cy="20" r="1.5"></circle>
        </svg>
        <span id="cartCount" class="cart-count">0</span>
      </a>
      <div class="header-cta">
        <button class="burger" id="burgerBtn" type="button" aria-label="開啟選單" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- Mobile Drawer -->
  <div class="mobile-drawer" id="mobileDrawer" aria-hidden="true">
    <div class="mobile-dropdown" role="dialog" aria-modal="true" aria-label="手機選單">
      <nav class="mobile-nav">
        <a href="brand.html">品牌故事</a>
        <a href="products.html">產品</a>
        <a href="service.html">服務</a>
        <a href="articles.html">文章</a>
        <a href="contact.html">聯絡</a>
        <a href="faq.html">FAQ</a>
      </nav>
      <div class="mobile-panel-actions">
        <a class="btn" href="products.html">探索精油</a>
        <a class="btn primary" href="contact.html">立即聯絡</a>
      </div>
    </div>
  </div>

  <main class="container checkout-page">
    <div class="checkout-head">
      <h1>結帳</h1>
      <p class="muted">請確認訂單內容並填寫收件資訊。</p>
    </div>

    <div class="checkout-layout">
      <section class="checkout-form card">
        <h2>收件資訊</h2>

        <div class="checkout-field">
          <label for="buyerName">姓名</label>
          <input id="buyerName" placeholder="請輸入姓名" />
        </div>

        <div class="checkout-field">
          <label for="buyerPhone">電話</label>
          <input id="buyerPhone" placeholder="請輸入電話" />
        </div>

        <div class="checkout-field">
          <label for="buyerEmail">Email</label>
          <input id="buyerEmail" type="email" placeholder="請輸入 Email" />
        </div>

        <div class="checkout-field">
          <label for="shippingMethod">配送方式</label>
          <select id="shippingMethod">
            <option value="711-cod">7-11 貨到付款</option>
            <option value="711-card">7-11 刷卡付款</option>
            <option value="family-cod">全家 貨到付款</option>
            <option value="family-card">全家 刷卡付款</option>
            <option value="home-card">宅配 刷卡付款</option>
          </select>
        </div>

        <div class="checkout-field">
          <label for="address">收件地址 / 門市資訊</label>
          <textarea id="address" placeholder="宅配請填地址；超商請填門市名稱"></textarea>
        </div>

        <div class="checkout-field">
          <label for="note">訂單備註</label>
          <textarea id="note" placeholder="可留空"></textarea>
        </div>

        <button class="btn primary" id="placeOrderBtn">送出訂單</button>
        <p id="checkoutMsg" class="muted"></p>
      </section>

      <aside class="checkout-summary card">
        <h2>訂單摘要</h2>
        <div id="checkoutItems"></div>
        <div class="checkout-total">
          <span>商品小計</span>
          <strong id="checkoutTotal">NT$ 0</strong>
        </div>
        <p class="muted" style="font-size:12px;margin-top:8px">目前尚未串接金流，送出後建立訂單資料。</p>
      </aside>
    </div>
  </main>

  <footer class="footer">
    <div class="container footer-inner">
      <div>
        <div class="footer-brand">Arochemy</div>
        <div class="muted">櫟嶼國際有限公司<br>Liyu International Co., Ltd.</div>
        <div class="muted" style="margin-top:8px;">Tel：0911505015</div>
        <div class="muted">Email：lyu.aroma@gmail.com</div>
        <div class="muted" id="footer-address">地址：台灣</div>
        <div class="muted" style="margin-top:10px;">© <span id="year"></span> Arochemy</div>
      </div>
      <div class="footer-links">
        <a href="brand.html">品牌故事</a>
        <a href="products.html">產品</a>
        <a href="service.html">服務</a>
        <a href="articles.html">文章</a>
        <a href="contact.html">聯絡</a>
        <a href="faq.html">FAQ</a>
      </div>
    </div>
  </footer>

  <div class="social-fab">
    <a class="fab ig" id="social-ig-btn" href="#" aria-label="Instagram" target="_blank" rel="noopener">
      <span class="fab-text">IG</span>
    </a>
    <a class="fab line" id="social-line-btn" href="#" aria-label="LINE" target="_blank" rel="noopener">
      <span class="fab-text">LINE</span>
    </a>
  </div>

  <script src="js/cart-badge.js"></script>
  <script src="./main.js"></script>
  <script type="module" src="js/user.js"></script>
  <script type="module" src="js/checkout.js"></script>
  <script type="module">
    import { initializeApp, getApps } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
    import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';
    const cfg = {apiKey:"AIzaSyAgRq-fVWsQuyO2odbfVEjgOZoHyACEApI",authDomain:"trying-89dc6.firebaseapp.com",projectId:"trying-89dc6",storageBucket:"trying-89dc6.firebasestorage.app",messagingSenderId:"115559148124",appId:"1:115559148124:web:ac37b9c249183a919b5499"};
    const app = getApps().find(a=>a.name==='[DEFAULT]') || initializeApp(cfg);
    const db  = getFirestore(app);
    getDoc(doc(db,'settings','site')).then(snap=>{
      if(!snap.exists()) return;
      const d = snap.data();
      if(d.socialIG)   { document.getElementById('social-ig-btn').href   = d.socialIG; }
      if(d.socialLine) { document.getElementById('social-line-btn').href = d.socialLine; }
      if(d.contactAddress) {
        const el = document.getElementById('footer-address');
        if(el) el.textContent = '地址：' + d.contactAddress;
      }
    }).catch(()=>{});
  </script>
</body>
</html>
