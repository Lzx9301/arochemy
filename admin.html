<!doctype html>
<html lang="zh-Hant">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>商品後台｜Arochemy</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="icon" type="image/png" href="./images/logo.png" />
    <link rel="apple-touch-icon" href="./images/logo.png" />
    <style>
        .admin-page {
            max-width: 900px;
            margin: 40px auto;
            padding: 24px;
        }

        .admin-form {
            display: grid;
            gap: 16px;
        }

        .admin-field {
            display: grid;
            gap: 6px;
        }

        .admin-field label {
            font-weight: 700;
        }

        .admin-field input,
        .admin-field textarea,
        .admin-field select {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 16px;
        }

        .admin-field textarea {
            min-height: 120px;
            resize: vertical;
        }

        .admin-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .admin-check {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .admin-btn {
            padding: 14px 20px;
            border: none;
            border-radius: 999px;
            background: #111;
            color: white;
            font-weight: 700;
            cursor: pointer;
        }

        .admin-msg {
            margin-top: 16px;
            color: #456b55;
            font-weight: 700;
        }

@media (max-width: 640px) {
            .admin-row {
                grid-template-columns: 1fr;
            }

        }
        .admin-header {
            border-bottom: 1px solid #eee;
            background: #fff;
        }

        .admin-nav {
            max-width: 1100px;
            margin: 0 auto;
            padding: 16px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-logo {
            font-weight: 700;
            text-decoration: none;
            color: #111;
        }

        .admin-menu {
            display: flex;
            gap: 20px;
        }

        .admin-menu a {
            text-decoration: none;
            color: #555;
            font-size: 14px;
        }

        .admin-menu a:hover {
            color: #111;
        }

        .admin-logout {
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 999px;
            padding: 6px 14px;
            cursor: pointer;
        }

        .admin-panel {
            display: none;
        }

        .admin-panel.active {
            display: block;
        }

        .admin-list {
            display: grid;
            gap: 14px;
            margin-top: 20px;
        }

        .admin-data-card {
            border: 1px solid #eee;
            border-radius: 20px;
            padding: 18px;
            background: #fff;
        }

        .admin-data-card h3 {
            margin: 0 0 8px;
        }

        .admin-data-card p {
            margin: 4px 0;
            color: #555;
        }

        .admin-menu .admin-tab {
            border: none;
            background: transparent;
            border-radius: 0;
            padding: 0;
            color: #555;
            text-decoration: none;
            font-size: 15px;
            font-weight: 500;
        }

        .admin-menu .admin-tab:hover {
            color: #111;
        }

        .admin-menu .admin-tab.active {
            color: #111;
            font-weight: 700;
        }

        .admin-menu .admin-tab.active::after {
            content: "";
            display: block;
            height: 2px;
            background: #111;
            margin-top: 6px;
        }

        .admin-status-row {
            display: grid;
            grid-template-columns: 1fr 1fr auto;
            gap: 12px;
            align-items: end;
            margin: 16px 0;
        }

        .admin-status-row label {
            display: grid;
            gap: 6px;
            font-weight: 700;
        }

        .admin-status-row select {
            padding: 10px 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 15px;
        }

@media (max-width: 720px) {
            .admin-status-row {
                grid-template-columns: 1fr;
            }
        }
        .image-preview-wrap {
            margin-top: 12px;
        }

        #previewImage {
            display: none;
            width: 300px;
            height: 300px;
            object-fit: cover;
            border-radius: 20px;
            border: 1px solid #ddd;
        }

        .order-tools {
            display: grid;
            gap: 14px;
            margin: 18px 0 22px;
        }

        .order-filter-tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .order-filter {
            border: 1px solid #ddd;
            background: #fff;
            border-radius: 999px;
            padding: 8px 14px;
            cursor: pointer;
            font-weight: 700;
        }

        .order-filter.active {
            background: #111;
            color: #fff;
            border-color: #111;
        }

        .order-search {
            width: 100%;
            box-sizing: border-box;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 14px;
            font-size: 15px;
        }
        .product-tools {
            display: flex;
            gap: 12px;
            margin-top: 16px;
            margin-bottom: 24px;
        }

        .product-tools .admin-btn {
            width: auto;
            min-width: 180px;
        }

        .product-search {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #ddd;
            border-radius: 14px;
        }
        .admin-btn.primary{
          background:#4f6f57;
          color:#fff;
        }

        .admin-btn.secondary {
            background: #fff;
            color: #111;
            border: 1px solid #ddd;
        }
        .product-card-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
            margin: 14px 0;
        }

        .product-card-actions label {
            display: grid;
            gap: 6px;
            font-weight: 700;
        }

        .product-card-actions select {
            padding: 8px 12px;
            border: 1px solid #ddd;
            border-radius: 12px;
            font-size: 14px;
        }

        .product-featured-toggle {
            display: flex !important;
            grid-template-columns: none !important;
            flex-direction: row;
            gap: 8px !important;
            align-items: center;
            margin-top: 22px;
        }

        .dashboard-cards {
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 14px;
          margin: 24px 0;
        }
        
        .dashboard-card {
          border: 1px solid #eee;
          border-radius: 20px;
          background: #fff;
          padding: 18px;
        }
        
        .dashboard-card span {
          display: block;
          color: #666;
          font-size: 14px;
          margin-bottom: 8px;
        }
        
        .dashboard-card strong {
          font-size: 30px;
          font-size: 36px;
          font-weight: 800;
          color: #111;
        }
        
        @media (max-width: 800px) {
          .dashboard-cards {
            grid-template-columns: repeat(2, 1fr);
          }
        }

        .dashboard-card {
          transition: 0.2s;
        }
        
        .dashboard-card:hover {
          transform: translateY(-2px);
        }

        .order-detail-toggle {
          margin-top: 8px;
        }
        
        .order-detail-panel {
          margin-top: 16px;
          color: #555;
        }
        
        .order-detail-panel hr {
          border: none;
          border-top: 1px solid #eee;
          margin: 16px 0;
        }
        
        .order-detail-panel ul {
          margin-top: 8px;
          padding-left: 20px;
        }

    </style>
</head>

<body>
    <header class="admin-header">
        <div class="admin-nav">
            <a href="admin.html" class="admin-logo">Arochemy Admin</a>

            <nav class="admin-menu">
                <a href="#" class="admin-tab active" data-panel="productsPanel">商品</a>
                <a href="#" class="admin-tab" data-panel="usersPanel">會員</a>
                <a href="#" class="admin-tab" data-panel="ordersPanel">訂單</a>
            </nav>

            <button id="logoutBtn" class="admin-logout">登出</button>
        </div>
    </header>
    <main class="admin-page">

        <!-- 🔐 登入區 -->
        <section id="loginBox">
            <h1>管理員登入</h1>

            <div class="admin-form">
                <div class="admin-field">
                    <label>Email</label>
                    <input id="adminEmail" type="email" />
                </div>

                <div class="admin-field">
                    <label>密碼</label>
                    <input id="adminPassword" type="password" />
                </div>

                <button class="admin-btn" id="loginBtn" type="button">登入</button>

                <div class="admin-msg" id="loginMsg"></div>
            </div>
        </section>

        <!-- 🛠 後台區 -->


        <section id="adminBox" style="display:none;">
            <h1>後台管理</h1>
            <section class="dashboard-cards">
              <div class="dashboard-card">
                <span>商品總數</span>
                <strong id="statProducts">0</strong>
              </div>
            
              <div class="dashboard-card">
                <span>會員總數</span>
                <strong id="statUsers">0</strong>
              </div>
            
              <div class="dashboard-card">
                <span>待處理訂單</span>
                <strong id="statPendingOrders">0</strong>
              </div>
            
              <div class="dashboard-card">
                <span>已付款待出貨</span>
                <strong id="statPaidNotShipped">0</strong>
              </div>
            </section>
            <hr style="margin:32px 0;">
            <section id="productsPanel" class="admin-panel active">
                <h2>編輯商品</h2>
                <div class="product-tools">
                  <input
                    id="productSearch"
                    class="product-search"
                    placeholder="搜尋商品名稱、英文名稱、slug"
                  >
                
                  <button id="loadProductsListBtn" class="admin-btn secondary" type="button">
                    重新整理
                  </button>
                
                  <button id="newProductBtn" class="admin-btn primary" type="button">
                    新增商品
                  </button>
                </div>
                
                <div id="productsList" class="admin-list"></div>

                <button class="admin-btn" id="loadProductBtn" type="button">
                    載入商品資料
                </button>

                <div class="admin-msg" id="editMsg"></div>

                <form class="admin-form" id="productForm">
                    <div class="admin-row">
                        <div class="admin-field">
                            <label for="name">商品中文名稱</label>
                            <input id="name" required placeholder="例如：臺灣杉" />
                        </div>

                        <div class="admin-field">
                            <label for="en">英文名稱</label>
                            <input id="en" placeholder="例如：Taiwania" />
                        </div>
                    </div>

                    <div class="admin-row">
                        <div class="admin-field">
                            <label for="slug">Slug</label>
                            <input id="slug" required placeholder="例如：taiwania" />
                        </div>

                        <div class="admin-field">
                            <label for="category">分類</label>
                            <select id="category">
                                <option value="single-oil">單方精油</option>
                                <option value="blend-oil">複方精油</option>
                                <option value="spray">噴霧</option>
                                <option value="massage-oil">按摩油</option>
                                <option value="other">其他</option>
                            </select>
                        </div>
                    </div>
                    <div class="admin-field">
                        <label for="productStatus">商品狀態</label>
                        <select id="productStatus">
                            <option value="active">上架</option>
                            <option value="inactive">下架</option>
                        </select>
                    </div>

                    <div class="admin-field">
                        <label for="latin">拉丁學名</label>
                        <input id="latin" placeholder="例如：Taiwania cryptomerioides Hayata" />
                    </div>

                    <div class="admin-row">
                        <div class="admin-field">
                            <label for="price5">5 ml 價格</label>
                            <input id="price5" type="number" min="0" placeholder="666" />
                        </div>

                        <div class="admin-field">
                            <label for="price10">10 ml 價格</label>
                            <input id="price10" type="number" min="0" placeholder="1166" />
                        </div>
                    </div>

                    <div class="admin-field">
                        <label for="price30">30 ml 價格</label>
                        <input id="price30" type="number" min="0" placeholder="2666" />
                    </div>

                    <div class="admin-field">
                        <label>商品圖片</label>
                        <input type="file" id="productImage">

                        <div class="image-preview-wrap">
                            <img id="previewImage">
                        </div>
                    </div>

                    <div class="admin-field">
                        <label for="aroma">香氣概述</label>
                        <input id="aroma" placeholder="例如：油潤柔和的木質香調" />
                    </div>

                    <div class="admin-row">
                        <div class="admin-field">
                            <label for="plantOrigin">植物產地</label>
                            <input id="plantOrigin" placeholder="例如：臺灣" />
                        </div>

                        <div class="admin-field">
                            <label for="extractPart">萃取部位</label>
                            <input id="extractPart" placeholder="例如：木材" />
                        </div>
                    </div>

                    <div class="admin-row">
                        <div class="admin-field">
                            <label for="extractMethod">萃取方法</label>
                            <input id="extractMethod" placeholder="例如：蒸餾" />
                        </div>

                        <div class="admin-field">
                            <label for="family">科屬</label>
                            <input id="family" placeholder="例如：柏科臺灣杉屬" />
                        </div>
                    </div>

                    <div class="admin-field">
                        <label for="usageOverview">建議用途（概述）</label>
                        <input id="usageOverview" placeholder="例如：芳香療法、製作香水、擴香" />
                    </div>


                    <div class="admin-field">
                        <label for="compositionText">成分總覽</label>
                        <textarea id="compositionText" placeholder="每行一個成分，格式：名稱,百分比&#10;例如：倍半萜類-醇類,51.2&#10;倍半萜類,34.7&#10;其他,14.1"></textarea>
                    </div>
                    <div class="admin-field">
                        <label for="description">商品說明</label>
                        <textarea id="description" placeholder="每一段請換行，系統會自動轉成 description 陣列"></textarea>
                    </div>

                    <label class="admin-check">
                        <input id="featured" type="checkbox" checked />
                        設為精選商品
                    </label>

                    <button class="admin-btn" type="submit">儲存商品</button>

                    <div class="admin-msg" id="msg"></div>

                </form>
            </section>

            <section id="usersPanel" class="admin-panel">
                <h2>會員資料</h2>
                <button type="button" class="admin-btn" id="loadUsersBtn">重新整理會員資料</button>
                <div id="usersList" class="admin-list"></div>
            </section>

            <section id="ordersPanel" class="admin-panel">
                <h2>訂單管理</h2>

                <div class="order-tools">
                    <div class="order-filter-tabs">
                        <button type="button" class="order-filter active" data-filter="all">全部</button>
                        <button type="button" class="order-filter" data-filter="pending">待處理</button>
                        <button type="button" class="order-filter" data-filter="paid_not_shipped">待出貨</button>
                        <button type="button" class="order-filter" data-filter="shipped">已出貨</button>
                        <button type="button" class="order-filter" data-filter="completed">已完成</button>
                        <button type="button" class="order-filter" data-filter="cancelled">已取消</button>
                    </div>

                    <input id="orderSearch" class="order-search" placeholder="搜尋姓名、Email、電話、訂單編號" />

                    <button type="button" class="admin-btn" id="loadOrdersBtn">重新整理訂單資料</button>
                </div>

                <div id="ordersList" class="admin-list"></div>
            </section>
        </section>

    </main>
    <script src="js/cart-badge.js"></script>
    <script type="module" src="js/admin.js"></script>
</body>
</html>
