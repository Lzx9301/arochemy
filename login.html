<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>會員中心｜Arochemy</title>
  <link rel="icon" type="image/png" href="./images/logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      background: #fafafa;
    }
    .auth-card {
      width: min(100%, 480px);
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 18px 50px rgba(0,0,0,.06);
    }
    .auth-logo { display:block; width:180px; margin:0 auto 24px; }
    .auth-title { font-size:28px; margin:0 0 6px; letter-spacing:.04em; }
    .auth-subtitle { color:#666; margin:0 0 24px; line-height:1.7; font-size:14px; }
    .auth-field { margin-bottom:14px; }
    .auth-field label { display:block; font-weight:700; margin-bottom:6px; font-size:14px; }
    .auth-field input {
      width:100%; box-sizing:border-box;
      padding:12px 16px; border:1px solid #ddd;
      border-radius:999px; font-size:15px; outline:none;
      font-family:inherit;
    }
    .auth-field input:focus { border-color:#111; }
    .auth-field input:disabled { background:#f5f5f5; color:#999; }
    .auth-check {
      display:flex; gap:8px; align-items:center;
      margin:10px 0 22px; color:#555; font-size:14px; cursor:pointer;
    }
    .auth-check input { accent-color:#111; width:16px; height:16px; flex-shrink:0; }
    .auth-actions { display:grid; gap:10px; }
    .auth-btn {
      width:100%; border:none; border-radius:999px;
      padding:13px 18px; font-size:15px; font-weight:700;
      cursor:pointer; font-family:inherit; transition:all 0.15s;
    }
    .auth-btn.primary { background:#111; color:#fff; }
    .auth-btn.primary:hover { background:#333; }
    .auth-btn.secondary { background:#fff; color:#111; border:1.5px solid #ddd; }
    .auth-btn.secondary:hover { border-color:#111; }
    .auth-btn.light { background:transparent; color:#999; border:none; padding:8px; font-size:13px; }
    .auth-btn.danger { background:#fff; color:#c44; border:1.5px solid #fcc; }
    .auth-btn.danger:hover { background:#fff5f5; }
    .auth-msg { margin-top:16px; font-weight:600; line-height:1.6; font-size:14px; min-height:20px; }
    .auth-back { display:inline-block; margin-top:20px; color:#555; text-decoration:none; font-size:13px; }
    .auth-divider {
      display:flex; align-items:center; gap:12px;
      margin:20px 0; color:#ccc; font-size:12px;
    }
    .auth-divider::before, .auth-divider::after {
      content:''; flex:1; height:1px; background:#eee;
    }

    /* 會員中心面板 */
    .member-panel { display:none; }
    .member-welcome {
      display:flex; align-items:center; gap:14px; margin-bottom:24px;
    }
    .member-avatar-lg {
      width:52px; height:52px; border-radius:50%;
      background:#111; color:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:20px; font-weight:700; flex-shrink:0;
    }
    .member-welcome-info h2 { font-size:18px; margin:0 0 2px; }
    .member-welcome-info p { font-size:13px; color:#888; margin:0; }

    .member-section {
      background:#f9f9f9; border-radius:16px;
      padding:20px; margin-bottom:16px;
    }
    .member-section h3 {
      font-size:12px; font-weight:700;
      letter-spacing:0.12em; text-transform:uppercase;
      color:#999; margin:0 0 14px;
    }
    .member-sub-row {
      display:flex; align-items:center; justify-content:space-between;
      padding:4px 0;
    }
    .member-sub-row span { font-size:14px; color:#333; }

    /* Toggle */
    .m-toggle { position:relative; width:44px; height:24px; flex-shrink:0; }
    .m-toggle input { opacity:0; width:0; height:0; }
    .m-toggle-track {
      position:absolute; inset:0;
      background:#ddd; border-radius:24px;
      cursor:pointer; transition:background 0.2s;
    }
    .m-toggle input:checked + .m-toggle-track { background:#111; }
    .m-toggle-track::after {
      content:''; position:absolute;
      left:3px; top:3px; width:18px; height:18px;
      background:#fff; border-radius:50%;
      transition:transform 0.2s;
    }
    .m-toggle input:checked + .m-toggle-track::after { transform:translateX(20px); }

    /* ── 會員中心：桌機版左右雙欄排版 ──
       .auth-card 這個容器同時被登入/註冊/忘記密碼(窄卡片480px)跟
       會員中心共用，不能直接改動 .auth-card 本身的寬度，
       所以另外用 .member-view 這個修飾 class 只在顯示會員中心時
       放寬容器(JS 在切換 memberPanel 顯示狀態的同時，一併切換這個
       class，見下方 script)，完全不影響登入/註冊等其他畫面的寬度。 */
    .auth-card.member-view {
      width: min(100%, 1100px);
    }

    .member-layout {
      display: grid;
      grid-template-columns: 1.86fr 1fr; /* 約 65% : 35% */
      gap: 32px;
    }

    .member-col-orders { min-width: 0; }

    /* 「我的訂單」是會員中心的主要內容，標題視覺上要比右側設定更明顯，
       跟右側 .member-section h3 那種低調的小型大寫標籤做出區隔 */
    .member-section--orders h3 {
      font-size: 16px; font-weight: 700;
      letter-spacing: normal; text-transform: none;
      color: #111; margin: 0 0 16px;
    }

    /* 右欄：桌機版 sticky，跟著頁面往下捲時停留在 Header 下方。
       align-self:start 是關鍵，沒有這個 grid 預設會把子項目拉伸
       撐滿整個 row 高度，sticky 會完全失效。
       這裡刻意不加 max-height/overflow，如果右欄內容比視窗還高，
       用瀏覽器原生 sticky 行為讓它自然跟著頁面捲動，
       不會截斷任何內容，也不會產生內部小 scrollbar。 */
    .member-col-profile {
      position: sticky;
      top: calc(var(--header-h) + 16px);
      align-self: start;
    }

    /* 我的訂單 */
    .my-order-card {
      background:#fff; border:1px solid #eee; border-radius:12px;
      padding:14px 16px; margin-bottom:10px;
    }
    .my-order-top {
      display:flex; align-items:center; justify-content:space-between;
      gap:8px; flex-wrap:wrap;
    }
    .my-order-id { font-size:13px; font-weight:700; color:#111; }
    .my-order-date { font-size:12px; color:#999; margin-top:2px; }
    .my-order-total { font-size:14px; font-weight:700; color:#111; }
    .my-order-status {
      display:inline-block; font-size:11px; font-weight:700;
      padding:3px 10px; border-radius:999px; white-space:nowrap;
    }
    .my-order-status.pending { background:#f0f0f0; color:#666; }
    .my-order-status.paid    { background:#e8f0fe; color:#3b6fd6; }
    .my-order-status.shipped { background:#fff2e0; color:#c67d17; }
    .my-order-status.done    { background:#e9f7ee; color:#2f8a4c; }
    .my-order-status.cancel  { background:#fbe9e9; color:#b94a48; }
    .my-order-toggle-btn {
      background:none; border:none; color:#666; font-size:12px;
      text-decoration:underline; cursor:pointer; padding:8px 0 0; font-family:inherit;
    }
    .my-order-detail {
      display:none; margin-top:12px; padding-top:12px;
      border-top:1px dashed #e5e5e5;
    }
    .my-order-detail.open { display:block; }
    .my-order-detail h5 {
      font-size:11px; font-weight:700; letter-spacing:0.08em;
      text-transform:uppercase; color:#aaa; margin:12px 0 6px;
    }
    .my-order-detail h5:first-child { margin-top:0; }
    .my-order-item-row {
      display:flex; align-items:center; gap:10px; padding:6px 0;
      font-size:13px;
    }
    .my-order-item-thumb {
      width:40px; height:40px; border-radius:8px; overflow:hidden;
      background:#f5f5f5; flex-shrink:0; display:flex; align-items:center; justify-content:center;
    }
    .my-order-item-thumb img { width:100%; height:100%; object-fit:cover; }
    .my-order-item-info { flex:1; min-width:0; }
    .my-order-item-name { color:#111; }
    .my-order-item-spec { color:#999; font-size:12px; }
    .my-order-item-sub { color:#666; white-space:nowrap; }
    .my-order-line {
      display:flex; justify-content:space-between; font-size:13px;
      color:#555; padding:3px 0;
    }
    .my-order-line.total { font-weight:700; color:#111; font-size:14px; padding-top:6px; }
    .my-order-empty { color:#999; font-size:13px; text-align:center; padding:20px 0; }

    /* ── 900px 以下：會員中心自動恢復單欄，取消 sticky ──
       HTML 裡「我的訂單」本來就寫在「個人資料」之前，
       所以恢復單欄後順序自然就是：我的訂單 → 個人資料 → 電子報 → 登出，
       不需要額外用 order 調整。 */
    @media (max-width: 900px) {
      .auth-card.member-view { width: min(100%, 480px); }
      .member-layout { display: block; }
      .member-col-profile {
        position: static;
        margin-top: 24px; /* display:block 時 grid 的 gap 不會生效，補上間距 */
      }
    }

    @media (max-width:520px) {
      .auth-card { padding:28px 20px; border-radius:22px; }
      .auth-title { font-size:24px; }
    }
  </style>
</head>

  <main class="auth-page">
    <section class="auth-card">
      <img class="auth-logo" src="./images/head-logo.png" alt="Arochemy">

      <!-- ── 登入 / 註冊 面板 ── -->
      <div id="authPanel">
        <h1 class="auth-title">會員登入 / 註冊</h1>
        <p class="auth-subtitle">登入後可管理個人資料、訂閱設定與訂單紀錄。</p>

        <!-- 登入模式（預設） -->
        <div id="loginMode">
          <div class="auth-field">
            <label for="loginEmail">Email</label>
            <input id="loginEmail" type="email" placeholder="請輸入 Email" autocomplete="username">
          </div>
          <div class="auth-field">
            <label for="loginPassword">密碼</label>
            <input id="loginPassword" type="password" placeholder="請輸入密碼" autocomplete="current-password">
          </div>
          <div style="text-align:right;margin:-6px 0 4px">
            <button class="auth-btn light" id="showForgotBtn" type="button" style="padding:4px 0;font-size:13px">忘記密碼？</button>
          </div>
          <div class="auth-actions" style="margin-top:20px">
            <button class="auth-btn primary" id="loginBtn" type="button">會員登入</button>
          </div>
          <div class="auth-divider">或</div>
          <button class="auth-btn secondary" id="showRegisterBtn" type="button">還沒有帳號？立即註冊</button>
        </div>

        <!-- 註冊模式 -->
        <div id="registerMode" style="display:none">
          <div class="auth-field">
            <label for="regName">姓名</label>
            <input id="regName" placeholder="請輸入姓名">
          </div>
          <div class="auth-field">
            <label for="regPhone">電話</label>
            <input id="regPhone" placeholder="請輸入電話">
          </div>
          <div class="auth-field">
            <label for="regEmail">Email</label>
            <input id="regEmail" type="email" placeholder="請輸入 Email" autocomplete="username">
          </div>
          <div class="auth-field">
            <label for="regBirthday">生日</label>
            <input id="regBirthday" type="date">
          </div>
          <div class="auth-field">
            <label for="regPassword">密碼（至少 6 位）</label>
            <input id="regPassword" type="password" placeholder="請輸入密碼" autocomplete="new-password">
          </div>
          <label class="auth-check">
            <input id="regSubscribed" type="checkbox">
            訂閱電子報，接收新品與活動資訊
          </label>
          <div class="auth-actions">
            <button class="auth-btn primary" id="registerBtn" type="button">註冊會員</button>
            <button class="auth-btn light" id="showLoginBtn" type="button">已有帳號？返回登入</button>
          </div>
        </div>

        <!-- 忘記密碼模式 -->
        <div id="forgotMode" style="display:none">
          <div class="auth-field">
            <label for="forgotEmail">註冊 Email</label>
            <input id="forgotEmail" type="email" placeholder="請輸入註冊時使用的 Email" autocomplete="username">
          </div>
          <div class="auth-actions">
            <button class="auth-btn primary" id="sendResetBtn" type="button">寄送密碼重設信</button>
            <button class="auth-btn light" id="backToLoginFromForgot" type="button">返回登入</button>
          </div>
          <p id="forgotMsg" class="auth-msg"></p>
        </div>

        <!-- Email 待驗證提示 -->
        <div id="verifyPendingMode" style="display:none">
          <p class="auth-subtitle" style="margin-bottom:8px">
            驗證信已寄至 <strong id="verifyPendingEmail"></strong>，請先至信箱完成 Email 驗證後再登入。
          </p>
          <div class="auth-actions">
            <button class="auth-btn primary" id="resendVerifyBtn" type="button">重新寄送驗證信</button>
            <button class="auth-btn light" id="backToLoginFromVerify" type="button">返回登入／登出</button>
          </div>
          <p id="verifyPendingMsg" class="auth-msg"></p>
        </div>

        <p id="authMsg" class="auth-msg"></p>
      </div>

      <!-- ── 會員中心面板（登入後顯示）── -->
      <div id="memberPanel" class="member-panel">
        <div class="member-layout">

          <!-- 左欄：我的訂單 -->
          <div class="member-col-orders">
            <div class="member-section member-section--orders">
              <h3>我的訂單</h3>
              <p id="myOrdersMsg" class="auth-msg" style="margin-top:0"></p>
              <div id="myOrdersList"></div>
            </div>
          </div>

          <!-- 右欄：會員資料(桌機版 sticky) -->
          <div class="member-col-profile">

            <!-- 歡迎列 -->
            <div class="member-welcome">
              <div class="member-avatar-lg" id="memberInitial">A</div>
              <div class="member-welcome-info">
                <h2 id="memberName">會員</h2>
                <p id="memberEmailDisplay"></p>
              </div>
            </div>

            <!-- 個人資料 -->
            <div class="member-section">
              <h3>個人資料</h3>
              <div class="auth-field">
                <label for="editName">姓名</label>
                <input id="editName" placeholder="請輸入姓名">
              </div>
              <div class="auth-field">
                <label for="editPhone">電話</label>
                <input id="editPhone" placeholder="請輸入電話">
              </div>
              <div class="auth-field">
                <label>Email</label>
                <input id="editEmail" type="email" disabled>
              </div>
              <div class="auth-field">
                <label for="editBirthday">生日</label>
                <input id="editBirthday" type="date" disabled readonly>
                <div class="hint" id="birthdayHint" style="margin-top:6px;font-size:12px;color:#999">如需修改生日，請聯絡客服協助處理。</div>
              </div>
              <button class="auth-btn primary" id="saveProfileBtn" type="button" style="margin-top:4px">儲存資料</button>
            </div>

            <!-- 電子報訂閱 -->
            <div class="member-section">
              <h3>電子報設定</h3>
              <div class="member-sub-row">
                <span>訂閱 Arochemy 電子報<br><small style="color:#aaa;font-size:12px">接收新品上市與活動資訊</small></span>
                <label class="m-toggle">
                  <input type="checkbox" id="subToggle">
                  <span class="m-toggle-track"></span>
                </label>
              </div>
              <button class="auth-btn secondary" id="saveSubBtn" type="button" style="margin-top:14px">更新訂閱設定</button>
            </div>

            <!-- 登出 -->
            <div class="auth-actions">
              <button class="auth-btn danger" id="logoutBtn" type="button">登出</button>
            </div>

            <p id="memberMsg" class="auth-msg"></p>
          </div>

        </div>
      </div>

      <a class="auth-back" href="index.html">← 回到首頁</a>
    </section>
  </main>

  <script type="module">
/* ── 會員中心邏輯（inline，避免多個 Firebase 實例衝突）── */
import { initializeApp, getApps, getApp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
         signOut, onAuthStateChanged }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp }
  from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const cfg = {
  apiKey: 'AIzaSyAgRq-fVWsQuyO2odbfVEjgOZoHyACEApI',
  authDomain: 'trying-89dc6.firebaseapp.com',
  projectId: 'trying-89dc6',
  storageBucket: 'trying-89dc6.firebasestorage.app',
  messagingSenderId: '115559148124',
  appId: '1:115559148124:web:ac37b9c249183a919b5499',
};

const app  = getApps().length ? getApp() : initializeApp(cfg);
const auth = getAuth(app);
const db   = getFirestore(app);
const $    = id => document.getElementById(id);

function msg(id, text, err = false) {
  const el = $(id); if (!el) return;
  el.textContent = text;
  el.style.color = err ? '#b94a48' : '#456b55';
}

function escHtml(str) {
  return String(str ?? '')
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function errText(code) {
  return ({
    'auth/user-not-found':     '找不到此帳號，請先註冊。',
    'auth/wrong-password':     '密碼錯誤，請再試一次。',
    'auth/invalid-credential': '帳號或密碼錯誤，請再試一次。',
    'auth/email-already-in-use':'此 Email 已被註冊，請直接登入。',
    'auth/weak-password':      '密碼至少需要 6 個字元。',
    'auth/invalid-email':      'Email 格式不正確。',
    'auth/too-many-requests':  '嘗試次數過多，請稍後再試。',
  })[code] || '發生錯誤，請稍後再試。';
}

/* ── 4 種畫面狀態切換：login / register / forgot / verify ── */
const AUTH_MODES = { login: 'loginMode', register: 'registerMode', forgot: 'forgotMode', verify: 'verifyPendingMode' };
function showAuthMode(mode) {
  Object.values(AUTH_MODES).forEach(id => { const el = $(id); if (el) el.style.display = 'none'; });
  if (mode && AUTH_MODES[mode] && $(AUTH_MODES[mode])) $(AUTH_MODES[mode]).style.display = '';
  msg('authMsg', '');
}
function showVerifyPending(email) {
  showAuthMode('verify');
  if ($('verifyPendingEmail')) $('verifyPendingEmail').textContent = email || '';
  msg('verifyPendingMsg', '');
}

/* ── 登入/註冊/忘記密碼 切換 ── */
$('showRegisterBtn')?.addEventListener('click', () => showAuthMode('register'));
$('showLoginBtn')?.addEventListener('click', () => showAuthMode('login'));
$('showForgotBtn')?.addEventListener('click', () => showAuthMode('forgot'));
$('backToLoginFromForgot')?.addEventListener('click', () => showAuthMode('login'));

/* 「返回登入／登出」：因為這個畫面出現時使用者其實還是登入狀態(只是Email未驗證)，
   要按這顆才真的登出，回到一般登入畫面 */
$('backToLoginFromVerify')?.addEventListener('click', async () => {
  try { await signOut(auth); } catch (_) {}
  showAuthMode('login');
});

/* ── 登入 ── */
$('loginBtn')?.addEventListener('click', async () => {
  const email = $('loginEmail')?.value.trim();
  const pw    = $('loginPassword')?.value;
  if (!email || !pw) { msg('authMsg', '請填寫 Email 與密碼。', true); return; }
  const btn = $('loginBtn');
  btn.disabled = true; btn.textContent = '登入中…';
  try {
    await signInWithEmailAndPassword(auth, email, pw);
    // 後續(檢查是否已驗證、導向會員中心或待驗證畫面)交給 onAuthStateChanged 統一處理
  } catch(e) {
    msg('authMsg', errText(e.code), true);
  } finally {
    btn.disabled = false; btn.textContent = '會員登入';
  }
});

/* ── 註冊 ── */
$('registerBtn')?.addEventListener('click', async () => {
  const name     = $('regName')?.value.trim();
  const phone    = $('regPhone')?.value.trim();
  const email    = $('regEmail')?.value.trim();
  const birthday = $('regBirthday')?.value || ''; // <input type="date"> 原生就是 YYYY-MM-DD 字串，直接用，不轉成 Date 物件避免時區偏移
  const pw       = $('regPassword')?.value;
  const sub      = $('regSubscribed')?.checked || false;
  if (!email || !pw) { msg('authMsg', '請填寫 Email 與密碼。', true); return; }
  if (pw.length < 6) { msg('authMsg', '密碼至少需要 6 個字元。', true); return; }
  if (!birthday) { msg('authMsg', '請選擇生日。', true); return; }
  const btn = $('registerBtn');
  btn.disabled = true; btn.textContent = '註冊中…';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pw);

    // 會員資料一定要先寫入成功，就算後面寄驗證信失敗，帳號跟會員資料也都已經建立好了
    await setDoc(doc(db, 'members', cred.user.uid), {
      uid: cred.user.uid, name: name||'', phone: phone||'',
      email, birthday, subscribed: sub, createdAt: serverTimestamp(),
    });

    // 寄送驗證信；就算寄送失敗也不能刪掉剛建立的帳號/會員資料，只是提示可以之後重寄
    let verifyEmailSent = true;
    try {
      const token = await cred.user.getIdToken();
      const res = await fetch('https://arochemy-backend-production.up.railway.app/api/email/auth/verification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      });
      const data = await res.json();
      if (!res.ok || !data.success) {
        verifyEmailSent = false;
        console.warn('[Auth] 驗證信寄送失敗：', data.error || res.statusText);
      }
    } catch (e) {
      verifyEmailSent = false;
      console.warn('[Auth] 驗證信寄送失敗：', e.message);
    }

    // 注意：這裡刻意不立刻 signOut。因為「重新寄送驗證信」呼叫後端 API 時
    // 需要用 user.getIdToken() 拿目前登入者的憑證，如果馬上登出，
    // 待驗證畫面上的「重新寄送驗證信」會沒辦法用。
    // 讓 onAuthStateChanged 偵測到「已登入但 emailVerified=false」，
    // 自動顯示待驗證畫面(不會進會員中心)；真正要登出要按畫面上的「返回登入／登出」。
    showVerifyPending(email);
    msg('verifyPendingMsg',
      verifyEmailSent
        ? `註冊成功！驗證信已寄至 ${email}，請先完成 Email 驗證後再登入。`
        : '帳號已建立，但驗證信寄送失敗，可以點下方按鈕重新寄送。',
      !verifyEmailSent
    );

  } catch(e) {
    msg('authMsg', errText(e.code), true);
  } finally {
    btn.disabled = false; btn.textContent = '註冊會員';
  }
});

/* ── 重新寄送驗證信 ── */
let resendInFlight = false;
$('resendVerifyBtn')?.addEventListener('click', async () => {
  if (resendInFlight) return;
  const user = auth.currentUser;
  if (!user) { msg('verifyPendingMsg', '登入狀態已失效，請重新登入後再試一次。', true); return; }

  resendInFlight = true;
  const btn = $('resendVerifyBtn');
  btn.disabled = true; btn.textContent = '寄送中…';
  try {
    const token = await user.getIdToken();
    const res = await fetch('https://arochemy-backend-production.up.railway.app/api/email/auth/verification', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
    });

    if (res.status === 429) {
      msg('verifyPendingMsg', '寄送次數過多，請稍後再試。', true);
      resendInFlight = false;
      btn.disabled = false; btn.textContent = '重新寄送驗證信';
      return;
    }

    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || '寄送失敗');
    }

    msg('verifyPendingMsg', data.alreadyVerified ? '此帳號已經完成 Email 驗證。' : '驗證信已重新寄送，請至信箱查看。');
    // 成功後鎖定按鈕一段時間，避免使用者連續點擊灌爆信箱、觸發限流
    setTimeout(() => {
      resendInFlight = false;
      btn.disabled = false; btn.textContent = '重新寄送驗證信';
    }, 20000);
  } catch(e) {
    resendInFlight = false;
    btn.disabled = false; btn.textContent = '重新寄送驗證信';
    msg('verifyPendingMsg', '寄送失敗，請稍後再試。', true);
  }
});

/* ── 忘記密碼：寄送密碼重設信 ── */
$('sendResetBtn')?.addEventListener('click', async () => {
  const email = $('forgotEmail')?.value.trim();
  if (!email) { msg('forgotMsg', '請輸入 Email。', true); return; }
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    msg('forgotMsg', 'Email 格式不正確。', true);
    return;
  }

  const btn = $('sendResetBtn');
  btn.disabled = true; btn.textContent = '寄送中…';

  // 不管帳號存不存在，都顯示同一句話，避免被拿來試探哪些 Email 有註冊過
  const genericMsg = '如果此 Email 已註冊，系統將寄送密碼重設信至該信箱，請至信箱查看。';

  try {
    const res = await fetch('https://arochemy-backend-production.up.railway.app/api/email/auth/password-reset', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email }),
    });

    if (res.status === 429) {
      msg('forgotMsg', '寄送次數過多，請稍後再試。', true);
    } else if (res.status === 400) {
      msg('forgotMsg', 'Email 格式不正確。', true);
    } else {
      // 不論帳號存不存在，後端都回傳一樣的成功訊息，這裡統一顯示同一句話，
      // 不會因為 response 內容洩漏帳號是否已經註冊過
      msg('forgotMsg', genericMsg);
    }
  } catch(e) {
    // 網路等異常情況，一樣不能洩漏任何帳號存在與否的線索，顯示同一句通用訊息
    msg('forgotMsg', genericMsg);
  } finally {
    btn.disabled = false; btn.textContent = '寄送密碼重設信';
  }
});

/* ── 登出 ── */
$('logoutBtn')?.addEventListener('click', () => signOut(auth));

/* ── 儲存個人資料 ── */
$('saveProfileBtn')?.addEventListener('click', async () => {
  const user   = auth.currentUser; if (!user) return;
  const name   = $('editName')?.value.trim();
  const phone  = $('editPhone')?.value.trim();
  // 注意：這裡刻意不讀取 editBirthday 的值。生日只能由後台管理員修改，
  // 就算前端這個 disabled input 被人用開發者工具改掉值，這裡也完全不會用到它，
  // 送給 Firestore 的更新內容裡永遠不會包含 birthday 這個欄位。
  const btn = $('saveProfileBtn');
  btn.disabled = true; btn.textContent = '儲存中…';
  try {
    await updateDoc(doc(db, 'members', user.uid), {
      name: name||'', phone: phone||'',
      updatedAt: serverTimestamp(),
    });
    if ($('memberName')) $('memberName').textContent = name || '會員';
    if ($('memberInitial')) $('memberInitial').textContent = (name || user.email)[0].toUpperCase();
    msg('memberMsg', '✓ 個人資料已更新');
  } catch(e) {
    msg('memberMsg', '儲存失敗：' + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = '儲存資料';
  }
});

/* ── 更新訂閱 ── */
$('saveSubBtn')?.addEventListener('click', async () => {
  const user = auth.currentUser; if (!user) return;
  const sub = $('subToggle')?.checked || false;
  const btn = $('saveSubBtn');
  btn.disabled = true; btn.textContent = '更新中…';
  try {
    await updateDoc(doc(db, 'members', user.uid), { subscribed: sub, updatedAt: serverTimestamp() });
    msg('memberMsg', sub ? '✓ 已訂閱電子報' : '✓ 已取消訂閱');
  } catch(e) {
    msg('memberMsg', '更新失敗：' + e.message, true);
  } finally {
    btn.disabled = false; btn.textContent = '更新訂閱設定';
  }
});

/* ── 監聽登入狀態 ──
   三種狀態要分開處理：
   1) user 存在且 emailVerified=true  → 正常登入，進會員中心
   2) user 存在但 emailVerified=false → 停在待驗證畫面，不能進會員中心
   3) user 不存在                      → 顯示一般登入/註冊畫面
   千萬不能因為 user 物件存在，就把 authPanel 隱藏、memberPanel 顯示，
   一定要先檢查 emailVerified，不然未驗證的帳號會被誤判成正常登入。 */
onAuthStateChanged(auth, async user => {
  const authPanel   = $('authPanel');
  const memberPanel = $('memberPanel');
  const authCard    = document.querySelector('.auth-card');

  if (user && user.emailVerified) {
    /* ── 已驗證，正常登入 ── */
    if (authPanel)   authPanel.style.display  = 'none';
    if (memberPanel) memberPanel.style.display = 'block';
    authCard?.classList.add('member-view');

    /* 填入 email */
    if ($('editEmail'))         $('editEmail').value          = user.email;
    if ($('memberEmailDisplay'))$('memberEmailDisplay').textContent = user.email;

    /* 更新 header */
    const headerEmail = document.getElementById('userEmail');
    if (headerEmail) headerEmail.textContent = user.email;
    const headerArea  = document.getElementById('userArea');
    if (headerArea)  { headerArea.href = 'login.html'; headerArea.onclick = null; }

    /* 更新 lastLoginAt：只有真正完成驗證並正常登入才更新，
       未驗證的情況不會走到這個分支，所以不會誤更新登入紀錄 */
    try { await updateDoc(doc(db, 'members', user.uid), { lastLoginAt: serverTimestamp() }); } catch(_) {}

    /* 讀取會員資料 */
    try {
      const snap = await getDoc(doc(db, 'members', user.uid));
      if (snap.exists()) {
        const d = snap.data();
        if ($('editName'))    $('editName').value    = d.name  || '';
        if ($('editPhone'))   $('editPhone').value   = d.phone || '';
        if ($('subToggle'))   $('subToggle').checked = d.subscribed || false;
        if ($('memberName'))  $('memberName').textContent   = d.name || '會員';
        if ($('memberInitial'))$('memberInitial').textContent = (d.name || user.email)[0].toUpperCase();

        /* 生日：一律唯讀，會員本人不能自己新增或修改，只能由後台管理員處理。
           舊會員/尚未由客服補上生日的情況下，欄位留空，並換一句提示文字說明。 */
        const birthdayEl = $('editBirthday');
        const birthdayHintEl = $('birthdayHint');
        if (birthdayEl) birthdayEl.value = d.birthday || '';
        if (birthdayHintEl) {
          birthdayHintEl.textContent = d.birthday
            ? '如需修改生日，請聯絡客服協助處理。'
            : '尚未設定，請聯絡客服協助新增。';
        }
      }
    } catch(e) { console.warn('讀取會員資料失敗：', e.message); }

    /* 我的訂單：只有已驗證會員才載入 */
    loadMyOrders(user);

    /* 登入完成後，如果之前有頁面要求先登入才能繼續(例如結帳)，導回去 */
    const redirect = sessionStorage.getItem('loginRedirect');
    if (redirect) {
      sessionStorage.removeItem('loginRedirect');
      window.location.href = redirect;
    }

  } else if (user && !user.emailVerified) {
    /* ── 已登入，但 Email 還沒驗證：不能進會員中心 ── */
    if (memberPanel) memberPanel.style.display = 'none';
    if (authPanel)   authPanel.style.display  = '';
    authCard?.classList.remove('member-view');
    showVerifyPending(user.email);

  } else {
    /* ── 沒有登入 ── */
    if (memberPanel) memberPanel.style.display = 'none';
    if (authPanel)   authPanel.style.display  = '';
    authCard?.classList.remove('member-view');
    showAuthMode('login');
    const listEl = $('myOrdersList');
    if (listEl) listEl.innerHTML = ''; // 登出/未登入時清空，避免殘留上一個帳號的訂單資料
  }
});

/* ══════════════════════════════════════════════════════════
   我的訂單：只有已驗證會員才會呼叫(見上方 onAuthStateChanged 分支)
══════════════════════════════════════════════════════════ */
const ORDER_STATUS_LABEL = { pending: '待處理', paid: '已付款', shipped: '已出貨', done: '已完成', cancel: '已取消' };

async function loadMyOrders(user) {
  const listEl = $('myOrdersList');
  const msgEl  = $('myOrdersMsg');
  if (!listEl) return;

  listEl.innerHTML = '<p class="my-order-empty">載入中…</p>';
  if (msgEl) { msgEl.textContent = ''; msgEl.className = 'auth-msg'; }

  try {
    const token = await user.getIdToken();
    const res = await fetch('https://arochemy-backend-production.up.railway.app/api/orders/mine', {
      headers: { 'Authorization': `Bearer ${token}` },
    });

    if (res.status === 401) {
      listEl.innerHTML = '';
      if (msgEl) { msgEl.textContent = '登入狀態已失效，請重新登入後再試一次。'; msgEl.className = 'auth-msg error'; }
      return;
    }
    if (res.status === 403) {
      listEl.innerHTML = '';
      if (msgEl) { msgEl.textContent = '請先完成 Email 驗證後再查看訂單。'; msgEl.className = 'auth-msg error'; }
      return;
    }

    const data = await res.json();
    if (!res.ok || !data.success) {
      throw new Error(data.error || '讀取訂單失敗');
    }

    renderMyOrders(data.orders || []);

  } catch (e) {
    listEl.innerHTML = '';
    if (msgEl) { msgEl.textContent = '訂單載入失敗，請稍後再試。'; msgEl.className = 'auth-msg error'; }
    console.warn('[MyOrders] 載入失敗：', e.message);
  }
}

function renderMyOrders(orders) {
  const listEl = $('myOrdersList');
  if (!listEl) return;

  if (!orders.length) {
    listEl.innerHTML = '<p class="my-order-empty">目前還沒有訂單紀錄。</p>';
    return;
  }

  // 前端自己再排序一次，確保「最新訂單排最上面」不會依賴後端/Firestore回傳順序
  const sorted = [...orders].sort((a, b) => {
    const at = parseOrderDate(a.createdAt);
    const bt = parseOrderDate(b.createdAt);
    if (!at && !bt) return 0;
    if (!at) return 1;  // 沒有日期的排到最後
    if (!bt) return -1;
    return bt - at; // 新到舊
  });

  listEl.innerHTML = sorted.map((o, i) => {
    const shortId    = String(o.id || '').slice(-6).toUpperCase();
    const dateStr    = formatOrderDate(o.createdAt);
    const statusText = ORDER_STATUS_LABEL[o.status] || o.status || '—';

    const itemsHtml = (o.items || []).map(item => {
      const sub = (Number(item.price) || 0) * (Number(item.qty) || 1);
      return `
        <div class="my-order-item-row">
          <div class="my-order-item-thumb">${item.image ? `<img src="${escHtml(item.image)}" alt="">` : '🌿'}</div>
          <div class="my-order-item-info">
            <div class="my-order-item-name">${escHtml(item.name || '—')}</div>
            <div class="my-order-item-spec">${escHtml(item.spec || '')}${item.spec ? '　' : ''}× ${Number(item.qty) || 1}・單價 NT$ ${Number(item.price || 0).toLocaleString()}</div>
          </div>
          <div class="my-order-item-sub">NT$ ${sub.toLocaleString()}</div>
        </div>
      `;
    }).join('');

    const addressText = o.address || o.storeInfo || '—';

    return `
      <div class="my-order-card">
        <div class="my-order-top">
          <div>
            <div class="my-order-id">#${escHtml(shortId)}</div>
            <div class="my-order-date">${escHtml(dateStr)}</div>
          </div>
          <span class="my-order-status ${escHtml(o.status || '')}">${escHtml(statusText)}</span>
        </div>
        <div class="my-order-top" style="margin-top:8px">
          <div class="my-order-total">NT$ ${Number(o.total || 0).toLocaleString()}</div>
          <button class="my-order-toggle-btn" type="button" data-idx="${i}">查看詳細資料 ▾</button>
        </div>
        <div class="my-order-detail" id="myOrderDetail-${i}">
          <h5>商品</h5>
          ${itemsHtml || '<p class="my-order-empty" style="padding:8px 0">（無商品資料）</p>'}
          <h5>金額</h5>
          <div class="my-order-line"><span>商品小計</span><span>NT$ ${Number(o.subtotal ?? o.total ?? 0).toLocaleString()}</span></div>
          ${o.discount ? `<div class="my-order-line"><span>優惠折抵</span><span>-NT$ ${Number(o.discount).toLocaleString()}</span></div>` : ''}
          ${o.coupon?.code ? `<div class="my-order-line"><span>使用優惠券</span><span>${escHtml(o.coupon.code)}</span></div>` : ''}
          <div class="my-order-line total"><span>訂單總額</span><span>NT$ ${Number(o.total || 0).toLocaleString()}</span></div>
          <h5>配送／收件</h5>
          <div class="my-order-line"><span>收件人</span><span>${escHtml(o.customerName || '—')}</span></div>
          <div class="my-order-line"><span>Email</span><span>${escHtml(o.customerEmail || '—')}</span></div>
          <div class="my-order-line"><span>電話</span><span>${escHtml(o.customerPhone || '—')}</span></div>
          <div class="my-order-line"><span>配送方式</span><span>${escHtml(o.shippingMethod || '—')}</span></div>
          <div class="my-order-line"><span>地址／門市</span><span>${escHtml(addressText)}</span></div>
          ${o.note ? `<div class="my-order-line"><span>訂單備註</span><span>${escHtml(o.note)}</span></div>` : ''}
          ${o.trackingNumber ? `<div class="my-order-line"><span>物流單號</span><span>${escHtml(o.trackingNumber)}</span></div>` : ''}
        </div>
      </div>
    `;
  }).join('');

  listEl.querySelectorAll('.my-order-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const detailEl = $('myOrderDetail-' + btn.dataset.idx);
      if (!detailEl) return;
      const willOpen = !detailEl.classList.contains('open');
      detailEl.classList.toggle('open', willOpen);
      btn.textContent = willOpen ? '收合詳細資料 ▴' : '查看詳細資料 ▾';
    });
  });
}

/* 後端已經把 createdAt 轉成明確的 ISO 字串再回傳(見 routes/orders.js /mine)，
   這裡多留幾種判斷只是保險，不會影響正常運作 */
function parseOrderDate(ts) {
  if (!ts) return null;
  let d;
  if (ts.toDate) d = ts.toDate();
  else if (ts._seconds != null) d = new Date(ts._seconds * 1000);
  else if (ts.seconds != null) d = new Date(ts.seconds * 1000);
  else d = new Date(ts);
  return isNaN(d.getTime()) ? null : d;
}

function formatOrderDate(ts) {
  const d = parseOrderDate(ts);
  return d ? d.toLocaleDateString('zh-TW', { year: 'numeric', month: '2-digit', day: '2-digit' }) : '—';
}
