<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>帳號操作｜Arochemy</title>
  <link rel="icon" type="image/png" href="./images/logo.png" />
  <style>
    /* ── 這份 <style> 刻意跟 login.html 的 .auth-* 系列樣式保持一致，
       維持品牌識別統一。login.html 這次不能修改，所以無法共用同一份
       <style>，只能在這裡複製一份對應的視覺規格。══════════════════ */
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system,"Segoe UI", Arial, "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      color: #111;
      line-height: 1.6;
    }
    .auth-page {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 40px 20px;
      background: #fafafa;
    }
    .auth-card {
      width: min(100%, 480px);
      background: #fff;
      border: 1px solid #e8e8e8;
      border-radius: 28px;
      padding: 36px;
      box-shadow: 0 18px 50px rgba(0,0,0,.06);
    }
    .auth-logo-link { display: block; text-align: center; margin-bottom: 24px; }
    .auth-logo { display: inline-block; width: 180px; max-width: 100%; }
    .auth-title { font-size: 28px; margin: 0 0 6px; letter-spacing: .04em; }
    .auth-subtitle { color: #666; margin: 0 0 24px; line-height: 1.7; font-size: 14px; }
    .auth-field { margin-bottom: 14px; }
    .auth-field label { display: block; font-weight: 700; margin-bottom: 6px; font-size: 14px; }
    .auth-field input {
      width: 100%; box-sizing: border-box;
      padding: 12px 16px; border: 1px solid #ddd;
      border-radius: 999px; font-size: 15px; outline: none;
      font-family: inherit;
    }
    .auth-field input:focus { border-color: #111; }
    .auth-actions { display: grid; gap: 10px; margin-top: 20px; }
    .auth-btn {
      width: 100%; border: none; border-radius: 999px;
      padding: 13px 18px; font-size: 15px; font-weight: 700;
      cursor: pointer; font-family: inherit; transition: all 0.15s;
    }
    .auth-btn.primary { background: #111; color: #fff; }
    .auth-btn.primary:hover { background: #333; }
    .auth-btn.primary:disabled { background: #ccc; cursor: not-allowed; }
    .auth-btn.secondary { background: #fff; color: #111; border: 1.5px solid #ddd; }
    .auth-btn.secondary:hover { border-color: #111; }
    .auth-msg { margin-top: 16px; font-weight: 600; line-height: 1.6; font-size: 14px; min-height: 20px; }
    .auth-msg.error { color: #b94a48; }
    .auth-msg.ok { color: #456b55; }
    .auth-back { display: inline-block; margin-top: 20px; color: #555; text-decoration: none; font-size: 13px; }
    .auth-back:hover { color: #111; }

    /* ── 本頁專屬：結果狀態畫面（成功/錯誤/載入中）── */
    .auth-icon { font-size: 40px; text-align: center; margin-bottom: 16px; }
    .auth-result-title { font-size: 22px; margin: 0 0 10px; text-align: center; }
    .auth-result-text { color: #666; font-size: 14px; line-height: 1.8; text-align: center; margin: 0 0 8px; }
    .auth-loading { text-align: center; color: #999; font-size: 14px; padding: 20px 0; }
    .auth-view { display: none; }
    .auth-view.active { display: block; }

    @media (max-width: 520px) {
      .auth-card { padding: 28px 20px; border-radius: 22px; }
      .auth-title, .auth-result-title { font-size: 22px; }
      .auth-logo { width: 150px; }
    }
  </style>
</head>
<body>

  <main class="auth-page">
    <section class="auth-card">
      <a class="auth-logo-link" href="index.html" aria-label="回到 Arochemy 首頁">
        <img class="auth-logo" src="./images/head-logo.png" alt="Arochemy">
      </a>

      <!-- ══ 載入中：正在解析連結、驗證 oobCode ══ -->
      <div id="viewLoading" class="auth-view active">
        <p class="auth-loading">正在確認您的連結，請稍候…</p>
      </div>

      <!-- ══ resetPassword：輸入新密碼 ══ -->
      <div id="viewResetForm" class="auth-view">
        <h1 class="auth-title">重設會員密碼</h1>
        <p class="auth-subtitle">請輸入您的新密碼，設定完成後即可使用新密碼登入 Arochemy 會員帳號。</p>

        <div class="auth-field">
          <label for="newPassword">新密碼</label>
          <input id="newPassword" type="password" placeholder="至少 6 個字元" autocomplete="new-password">
        </div>
        <div class="auth-field">
          <label for="newPasswordConfirm">再次輸入新密碼</label>
          <input id="newPasswordConfirm" type="password" placeholder="請再輸入一次" autocomplete="new-password">
        </div>

        <div class="auth-actions">
          <button class="auth-btn primary" id="confirmResetBtn" type="button">確認修改</button>
        </div>
        <p id="resetFormMsg" class="auth-msg"></p>
      </div>

      <!-- ══ resetPassword：成功 ══ -->
      <div id="viewResetSuccess" class="auth-view">
        <div class="auth-icon">✓</div>
        <h1 class="auth-result-title">密碼已成功更新</h1>
        <p class="auth-result-text">您的 Arochemy 會員密碼已更新，現在可以使用新密碼登入。</p>
        <div class="auth-actions">
          <a class="auth-btn primary" href="login.html" style="text-decoration:none;text-align:center;display:block">前往會員登入</a>
        </div>
      </div>

      <!-- ══ verifyEmail：成功 ══ -->
      <div id="viewVerifySuccess" class="auth-view">
        <div class="auth-icon">✓</div>
        <h1 class="auth-result-title">Email 驗證完成</h1>
        <p class="auth-result-text">您的 Arochemy 會員帳號已完成 Email 驗證，現在可以登入會員中心。</p>
        <div class="auth-actions">
          <a class="auth-btn primary" href="login.html" style="text-decoration:none;text-align:center;display:block">前往會員登入</a>
        </div>
      </div>

      <!-- ══ 共用錯誤畫面（連結無效/過期、不支援的操作、未知錯誤）══ -->
      <div id="viewError" class="auth-view">
        <div class="auth-icon">⚠</div>
        <h1 class="auth-result-title" id="errorTitle">連結已失效</h1>
        <p class="auth-result-text" id="errorText">此連結已失效或已過期。</p>
        <div class="auth-actions">
          <a class="auth-btn secondary" href="login.html" style="text-decoration:none;text-align:center;display:block">前往會員登入</a>
        </div>
      </div>

      <a class="auth-back" href="index.html">← 回到 Arochemy 首頁</a>
    </section>
  </main>

  <script type="module" src="js/auth-action.js"></script>
</body>
</html>
